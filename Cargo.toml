[workspace]
members = ["crates/ghostty-sys"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[package]
name = "herder-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.89"

[dependencies]
herdr-client-lib = { path = "../herdr-client-lib" }
ghostty-sys = { path = "crates/ghostty-sys" }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
futures-util = "0.3"
serde_json = "1"
