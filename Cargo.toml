[workspace]
members = ["crates/ghostty-sys"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[package]
name = "herdr-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.89"

[dependencies]
herdr-client-lib = { git = "https://github.com/nick1udwig/herdr-client-lib.git", rev = "60a1bed82b92e4bbc537b7cffef771ed1912e54f" }
ghostty-sys = { path = "crates/ghostty-sys" }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
unicode-segmentation = "1"
unicode-width = "0.2"
png = "0.17"
toml = "0.8"
libc = "0.2"
terminal-colorsaurus = "1.0.3"
